# GitHub Pages（このリポジトリの docs/ を公開元にする）で公開するのは、index.md と privacy-policy.md
# だけ。他の docs（仕様・設計・WBS・ストア掲載情報・ブランド資料）は、リポジトリでは読めるが、アプリの
# 公式サイトのページとしては公開しない。docs/ に文書を足したときも、公開するページは、ここに無い
# ものではなく、この2つだけにするため、公開しないものを名前で除く（足した文書が `singfolio-` で
# 始まらない場合は、ここにも足す）。
exclude:
  - "singfolio-*.md"
  - "*.png"
